name = "anu-student-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = false
preview_urls = false

# Target custom domain route: https://api.freeze.edu.kg/*
routes = [
  { pattern = "api.freeze.edu.kg", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
FIREBASE_PROJECT_ID = "project-8995408b-d1b3-4571-83b"
ALLOWED_ORIGINS = "https://freeze.edu.kg"
TURNSTILE_ALLOWED_HOSTNAMES = "freeze.edu.kg"
ADMIN_REQUIRE_ACCESS = "true"
# Public verifier identifiers copied from the ANU Admin API Access application.
ADMIN_ACCESS_ISSUER = "https://quiet-water-b981.cloudflareaccess.com"
ADMIN_ACCESS_AUD = "60e7dfa8a0b49413a78121123850efa79cfda3b640ba936b232eaa00bf015a81"
RATE_LIMIT_IP_PER_MIN = "120"
RATE_LIMIT_UID_PER_MIN = "30"
RATE_LIMIT_WRITE_PER_HOUR = "25"

# Cloudflare D1 Database Binding
# Replace database_id with the output from: npx wrangler d1 create anu-campus-db
[[d1_databases]]
binding = "DB"
database_name = "anu-campus-db"
database_id = "44fe8355-8004-482c-84db-2c75c61b20ef"
migrations_dir = "migrations"

# Account-scoped namespaces; reserve these IDs for ANU only at deployment review.
[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "353403995691"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "UID_RATE_LIMITER"
namespace_id = "353403995692"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "353403995693"
simple = { limit = 10, period = 60 }

# ============================================================================
# Required Secrets (Set via `npx wrangler secret put <NAME>`, NEVER commit):
#   - TURNSTILE_SECRET_KEY : Cloudflare Turnstile server-side secret key
#   - ADMIN_API_TOKEN      : High-entropy ≥32 byte token for /api/v1/admin/*
#   - IP_HASH_SALT         : Random salt for privacy-preserving IP hashing
# ============================================================================
